name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omnisync
          POSTGRES_PASSWORD: omnisync
          POSTGRES_DB: omnisync_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omnisync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Store and gateway durability tests run against a real PostgreSQL.
      OMNISYNC_TEST_DATABASE_URL: postgres://omnisync:omnisync@localhost:5432/omnisync_test
      # The S3 adapter and Object Lock tests run against an S3-compatible server (moto) started below.
      OMNISYNC_TEST_S3_ENDPOINT: http://127.0.0.1:54330
      OMNISYNC_REQUIRE_S3: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start an S3-compatible server with Object Lock
        run: |
          pip install 'moto[server]==5.2.3'
          nohup moto_server -H 127.0.0.1 -p 54330 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:54330/moto-api/ >/dev/null && exit 0; sleep 1; done
          cat moto.log; exit 1
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  bench-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Small run: proves the harness works and every engine converges end to end.
      - run: pnpm bench
        env:
          BENCH_OPS: "2000"
          BENCH_EDITORS: "5"
          BENCH_EDITS: "10"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results/*.json
