name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omnisync
          POSTGRES_PASSWORD: omnisync
          POSTGRES_DB: omnisync_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omnisync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Store and gateway durability tests run against a real PostgreSQL.
      OMNISYNC_TEST_DATABASE_URL: postgres://omnisync:omnisync@localhost:5432/omnisync_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  bench-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Small run: proves the harness works and every engine converges end to end.
      - run: pnpm bench
        env:
          BENCH_OPS: "2000"
          BENCH_EDITORS: "5"
          BENCH_EDITS: "10"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results/*.json
