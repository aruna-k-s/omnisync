{{- if .Values.secrets.externalSecret.enabled }}
{{- $ctx := dict "root" . "component" "secrets" }}
apiVersion: {{ .Values.secrets.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "omnisync.fullname" . }}-secrets
  labels:
    {{- include "omnisync.labels" $ctx | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.secrets.existingSecret }}
    creationPolicy: Owner
  data:
    {{- range $key := keys .Values.secrets.externalSecret.remoteKeys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ index $.Values.secrets.externalSecret.remoteKeys $key }}
    {{- end }}
{{- end }}
