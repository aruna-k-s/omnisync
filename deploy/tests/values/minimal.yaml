# The smallest legal install against an external PostgreSQL and S3.
tenant: acme
hosts: { api: api.acme.test, gateway: sync.acme.test, console: console.acme.test, app: app.acme.test }
adminEmails: [admin@acme.test]
oidc: { issuer: "https://idp.acme.test", clientId: omnisync }
publicKeys:
  issuer: "1111111111111111111111111111111111111111111111111111111111111111"
  ledger: "2222222222222222222222222222222222222222222222222222222222222222"
storage:
  checkpoint: { retainDays: 365 }
networkPolicy:
  egress:
    postgresql: { cidrs: ["10.20.0.0/24"] }
    s3: { cidrs: ["10.30.0.0/24"] }
